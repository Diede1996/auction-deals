# Technical settings. Your watchlist and profit targets live in watchlist.yml.

# An auction is included when its title or description contains one of these words: bankruptcy,
# business-closure and estate sales (people who have to get rid of their things). Words also match inside
# longer words ("boedel" matches "inboedel" and "boedelveiling"). Add "executie" to also include forced
# sales (executieveilingen).
auction_keywords:
  - faillissement
  - failliet
  - faillite
  - curator
  - bankrupt
  - insolvent
  - insolventie
  - bedrijfsbeëindiging
  - bedrijfsbeeindiging
  - beëindiging bedrijfsactiviteiten
  - bedrijfsopheffing
  - opheffingsuitverkoop
  - liquidatie
  - stopzetting
  - faling             # Flemish for bankruptcy ("uit diverse falingen")
  - curatele
  # estates and house clearances
  - nalatenschap       # also "nalatenschappen"
  - erfenis
  - overlijden         # "inboedel na overlijden"
  - boedel             # "inboedel", "boedelveiling"
  - ontruiming         # "woningontruiming", "huisontruiming"
  - uitruiming         # Flemish: "volledige uitruiming van kantoor en werkplaats"

# Also read auctions that aren't a bankruptcy, closure or estate, when their NAME has one of these words:
# ordinary IT auctions (ex-lease laptops, monitors, Troostwijk's "Computers, Tablets, ...").
# A trial: margins there are usually thinner (refurbishers bid too). Set enabled: false to stop.
# Unlike auction_keywords, these only count as a word or the start of one ("it" is not "uit").
extra_auctions:
  enabled: true
  words: [it, ict, computer, laptop, notebook, monitor, beeldscherm, hardware, apple, macbook, ipad, tablets,
          informatica]   # informatica = Flemish for IT

# Buyer's costs per site, used to work out what you really pay.
#   premium    buyer's premium (opgeld) as a fraction of the bid: 0.18 = 18%
#   vat        VAT charged on bid + premium
#   fixed_fee  fixed costs per lot (excl. VAT), if the site charges them
sites:
  troostwijk:
    # Off: Troostwijk answers GitHub's servers with "403 Forbidden", so it refuses automated visitors.
    # Troostwijk lots come from their own alert emails instead: see troostwijk_alerts below.
    enabled: false
    countries: [nl]      # add be, de, ... to include lots in other countries
    premium: 0.18        # Troostwijk sets this per auction; 18% is an estimate, check the lot page
    vat: 0.21
    fixed_fee: 0
  proveiling:
    enabled: true
    premium: 0.16        # "Het opgeld bedraagt 16% over de bieding"
    vat: 0.21
  hnvi:
    enabled: true
    premium: 0.19        # HNVI veilingcondities: 19% excl. VAT
    vat: 0.21
  plaatsjebod:
    enabled: true
    premium: 0.22        # "Je bod wordt verhoogd met 22% opgeld en 21% BTW"
    vat: 0.21
  onlineveilingmeester:
    enabled: true
    # Which auctions to include besides ones with a bankruptcy word in the name:
    #   FAILLISEMENT = bankruptcy, DRZ = Domeinen Roerende Zaken (government sales: seized goods, surplus),
    #   OVERHEID = municipalities, provinces and water boards. Add OVERHEID to the list to include those too.
    auction_types: [FAILLISEMENT, DRZ]
    premium: 0.17        # 17% + VAT for VAT items; set per lot: DRZ 10%, margin-scheme items 21%/12.1% incl. VAT
    vat: 0.21
  veilingwinnaar:        # veilingwinnaar.nl: closing restaurants, bakeries, butchers and gyms
    enabled: true
    premium: 0.18        # "De biedprijs is excl. 21 % BTW en 18% Veilingkosten"
    vat: 0.21
  inventarisveilingen:   # inventarisveilingen.nl (Nieuwegein): IT and office inventory from bankruptcies
    enabled: true
    premium: 0           # "Inventarisveilingen rekent geen extra opgeld/veilingkosten aan kopers"
    vat: 0.21            # "Uw bod is exclusief BTW"
  nedveiling:            # nedveiling.nl: mostly overstock; only its bankruptcy/closure/estate auctions are read
    enabled: true
    premium: 0.15        # "Veilingkosten 15%"
    vat: 0.21
  openbareverkopen:      # openbare-verkopen.be (Wielsbeke, Belgium): curator sales and closures in Flanders
    enabled: true
    premium: 0.19        # "17% of 19% (tenzij anders meegedeeld op het kavel)": 19% to be safe
    vat: 0.21
  vlavem:                # vlavem.com (Belgium): closures ("stopzettingsveiling"), estates, household contents
    enabled: true
    premium: 0.17        # "Het opgeld bedraagt 17% over de bieding"
    vat: 0.21            # VAT is on the 17% only for used goods; counted on the bid too, to be safe
  bellauction:           # bellauction.be (Waregem, Belgium): closing shops, restaurants and workshops
    enabled: true
    premium: 0.17        # "veilingkosten, 17 % opgeld, en BTW"
    vat: 0.21

# Margins and "room to bid" are worked out for the bid you'd have to place now, not the current bid:
# the starting bid while nobody has bid, else the current bid + one step. Onlineveilingmeester and Plaats Je
# Bod say the step per lot; for the other sites these usual steps are used: [from this bid, step].
bidding:
  steps: [[0, 1], [20, 5], [100, 10], [500, 25], [1000, 50], [5000, 100]]

# The daily Telegram summary (the scan itself runs once a day, see .github/workflows/scan.yml)
digest:
  enabled: true
  per_section: 8                # lots listed under "closing within 24 hours" and "new"
  warn_after_failed_scans: 2    # warn in Telegram when a site failed this many daily scans in a row
  ignore_closing_after_days: 30

# Telegram commands are checked every 5 minutes; they never contact the auction sites.
commands:
  max_extra_scans_per_day: 3    # how often /scan may start an extra scan per day

dashboard:
  url: ""                       # leave empty to use the GitHub Pages address of this repository

marktplaats:
  enabled: true
  cache_days: 3                 # reuse a lot's Marktplaats price for this many days (1 = check daily)
  fallback_days: 14             # if Marktplaats blocks the check, show saved prices up to this old
  min_listings: 4               # rough price (no type number in the lot title): need this many similar listings
  min_listings_exact: 2         # exact model: this many listings of the same model are enough
  max_items_per_lot: 0          # "40x colbert" counts as 40 colberts (price, margin and max bid x 40); 0 = no limit.
                                # Set e.g. 10 to count bigger bulk lots as one item instead.
  max_lookups_per_run: 60       # at most this many Marktplaats searches per scan
  delay_seconds: 4              # pause between Marktplaats searches...
  extra_random_delay: 3         # ...plus a random 0-3 seconds

# Driving costs to the pickup address ("ophaallocatie"). Your home address is NOT stored here (this
# repository is public): add it as the secret HOME_ADDRESS, e.g. "Dorpsstraat 1, Veghel".
driving:
  enabled: true
  km_per_liter: 16              # your car's fuel use: 16 = 1 op 16
  fuel_price: auto              # € per liter; auto = today's Belgian maximum price for Euro 95 E10
  fuel_price_fallback: 2.108    # used when the automatic price can't be read
  round_trip: true              # there and back
  extra_cost_per_km: 0          # optional wear and tear per km, e.g. 0.05
  include_in_max_bid: true      # count the trip as a cost in margins and suggested max bids
  # How far you drive for how many lots (one way, from the closer of your addresses): [up to minutes, lots].
  # Lots count when they have room to bid, need a bid check (Troostwijk) or are favorites, at the same
  # address on the same pickup day. Further than the last rule: transport (below), or never when that's off.
  # Lots that don't make it are hidden on the dashboard ("Show hidden" shows them) and left out of the
  # morning summary; favorites always show.
  trip_rules:
    - [30, 1]      # up to 30 min: worth it for a single lot
    - [90, 3]      # up to 1.5 hours: at least 3 lots
    - [120, 6]     # up to 2 hours: more than 5 lots
  # Further than the last trip rule: have a transporter (e.g. Brenger) bring it instead of hiding the lot.
  # A rough estimate per pickup (same address and day), split over the lots worth collecting there:
  # first_lot for one lot, + extra_lot for each extra lot. Adjust it once you have a real quote.
  transport:
    enabled: true
    first_lot: 75
    extra_lot: 25

# Troostwijk lots from Troostwijk's own search-alert emails, forwarded to a separate mailbox that the
# bot reads (secrets ALERTS_EMAIL and ALERTS_APP_PASSWORD, see README). The bot never visits Troostwijk.
troostwijk_alerts:
  enabled: true
  keep_days: 14                 # a lot without a closing time in the email stays this many days
  # Only lots of the same auctions as on the other sites (auction name with a word from auction_keywords,
  # or from extra_auctions when that's on, so "Computers, Tablets, ..." counts as an IT auction). Set this to
  # false to see all of Troostwijk's auctions. Lots whose auction the email doesn't name are always shown.
  only_bankruptcy: true

# Lots on your watchlist without a type number in the title ("2 x Dell 24 inch monitor"): the bot reads the
# description on the lot page once ("... type U2419 HC") and prices that model. Not for Troostwijk.
descriptions:
  enabled: true
  max_pages_per_run: 40         # new lot pages per scan; descriptions are remembered for 30 days

# Favorites: star lots on the dashboard (it asks for a GitHub token once, see README).
favorites:
  reminders: true               # the closing day (in the morning summary) and before closing
  remind_minutes_before: 60     # checked every 5 minutes, so reminders arrive 55-60 minutes before

http:
  delay_seconds: 1.5            # pause between requests to the same site
