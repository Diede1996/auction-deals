name: Scan auctions

on:
  schedule:
    # once a day at 04:17 UTC = 06:17 Dutch summer time (05:17 in winter).
    # GitHub may start scheduled runs a few minutes late.
    - cron: "17 4 * * *"
  workflow_dispatch: {}   # "Run workflow" button, also used by the /scan command

permissions:
  contents: write         # save data/state.json
  pages: write            # publish the dashboard
  id-token: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan
        run: python -m scanner scan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Save state
        if: always()
        run: |
          git config user.name "auction-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data && git add data
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Daily scan $(date -u +'%Y-%m-%d') [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 5; done
          exit 1

      - name: Prepare dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish dashboard
        id: deploy
        uses: actions/deploy-pages@v4
