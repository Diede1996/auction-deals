name: Advice lookup

# Marktplaats searches for the daily Claude advice (scanner/advice.py): the Claude session starts this for lots
# the bot couldn't price and reads the result from data/advice-lookups.json in the private repository.
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "Marktplaats searches, separated by ;"
        required: true

permissions:
  contents: read

concurrency:
  group: advice-lookup
  cancel-in-progress: false

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Search Marktplaats
        env:
          QUERIES: ${{ inputs.queries }}
          PRIVATE_REPO_TOKEN: ${{ secrets.PRIVATE_REPO_TOKEN }}
        run: python -m scanner.advice lookup --queries "$QUERIES"
