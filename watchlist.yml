  exclude: [wijnglas, wijnglazen, glas, glazen, wijnrek, rek, wijnkast, kast, wijnkoel, koelkast, koeler, klimaat,
    wijnklimaat, wijnklimaatkast, wijnemmer, emmer, karaf, decanteer, decanter, opener, kurkentrekker, wijnazijn, azijn,
    wijnvat, vat, vaten, tap, wijntap, dispenser, pomp, stopper, wijnkaart, menukaart, boek, schilderij, poster,
    leeg, lege, inventaris, meubel, tafel, stoel, kruk, bar, wijnbar, rack, display]
