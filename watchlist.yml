- name: Kitchen appliance
  keywords: [kitchenaid, thermomix, airfryer, smeg, vitamix, magimix]
  exclude: [onderdeel, onderdelen, hulpstuk, accessoire, accessoires, opzetstuk, defect]
- name: Suit / formalwear
