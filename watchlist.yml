# Your watchlist. Edit it here on GitHub or send commands to your Telegram bot (/help).
#
# settings:
#   resale_factor  what you expect to sell for, as a share of the Marktplaats median: 0.85 = 85%, 0.5 = 50%
#   min_margin     the suggested max bid always leaves at least this margin at that price:
#                  profit as a share of what you pay (bid + premium + VAT + driving): 0.3 = 30%
#   margin_tiers   (optional) a different margin for cheaper things, by expected sale price per item:
#                  - {up_to: 50, min_margin: 0.3} = things selling for at most €50 need 30%, the rest min_margin
#   transport_margin (optional) lots too far to drive that a transporter brings (config.yml driving.transport)
#                  need this margin instead; the transport estimate is still a cost
#   transport_min_value (optional) only when the lot, or the lots collected at the same pickup together, sell
#                  for at least this (at resale_factor); cheaper ones keep margin_tiers
#   min_profit     (optional) the suggested max bid also leaves at least this much profit in euros per item
#                  (a lot of 4 needs 4 x min_profit)
#
# items: one entry per thing you want to find
#   name               label used in messages and on the dashboard
#   keywords           search phrases; a lot matches when its title contains all words of one phrase
#   exclude            lots whose title contains any of these words are skipped
#   max_price          (optional) never suggest paying more than this in total (bid + premium + VAT)
#   market_price       (optional) your own resale value; skips the Marktplaats lookup
#   marktplaats_query  (optional) exact Marktplaats search to use for the resale value
#   min_margin         (optional) overrides the default above for this item

settings:
  resale_factor: 0.75
  min_margin: 0.25
  min_profit: 25
  transport_margin: 0.15
  transport_min_value: 100
items:
- name: Monitor
  # only these brands (Diede, 2026-10-29)
  keywords: [dell monitor, acer monitor, samsung monitor, hp monitor, philips monitor, dell beeldscherm,
    acer beeldscherm, samsung beeldscherm, hp beeldscherm, philips beeldscherm]
  exclude: [arm, monitorarm, beeldschermarm, beugel, monitorbeugel, houder, standaard, monitorstandaard,
    kabel, baby, babyfoon, monitoring, hartslag, tv, televisie]
- name: MacBook
  keywords: [macbook]
  exclude: [hoes, sleeve, tas, oplader, lader, adapter]
- name: iPad
  keywords: [ipad]
  exclude: [hoes, hoesje, case, cover, houder, standaard, screenprotector]
- name: Laptop
  keywords: [thinkpad, elitebook, probook, zbook, latitude, surface pro, surface laptop, laptop, notebook]
  exclude: [tas, laptoptas, hoes, laptophoes, sleeve, lader, oplader, laptoplader, adapter, dock, docking,
    dockingstation, standaard, laptopstandaard, koeler, laptopkoeler, slot, kabel, moleskine, gelinieerd]
- name: Power tools
  keywords: [makita, dewalt, milwaukee, hilti, festool, metabo, bosch professional, bosch gsr,
    bosch gsb, bosch gbh, bosch gws, bosch gks, bosch gst, bosch gll, bosch gcm]
  exclude: [koolborstel, koolborstels, onderdeel, onderdelen, reparatie, defect, diamantschijf, diamantschijven,
    zaagblad, zaagbladen, foudraal, t.b.v.]
- name: Coffee machine
