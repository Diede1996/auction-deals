- name: Wine
  # wine from closing restaurants and bars; prices are per bottle ("6 flessen", "6 x 75 cl").
  # Named wines first, so "Rioja" is what Marktplaats listings must say (they often leave out "wijn").
  keywords: [champagne, prosecco, cava, chateau, rioja, chianti, barolo, amarone, chablis, sancerre, bourgogne,
    merlot, cabernet, sauvignon, chardonnay, pinot, riesling, malbec, primitivo, tempranillo, shiraz, wijn, wijnen,
